<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Architecture Explorer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">TRANSLATE · ARCHITECTURE EXPLORER</p>
        <h1>顶层架构</h1>
        <p class="lede">已批准的逻辑职责，与源码覆盖核验分别呈现。</p>
      </header>
      <nav class="architecture-navigation" aria-label="架构层级导航">
        <div id="breadcrumb" class="breadcrumb" aria-label="当前位置"></div>
      </nav>
      <details id="source-snapshot" class="snapshot">
        <summary><span id="snapshot-heading">源码快照</span></summary>
        <dl id="snapshot-metadata"></dl>
      </details>
      <section aria-labelledby="modules-heading">
        <div class="section-heading">
          <h2 id="modules-heading">七个顶层模块</h2>
          <div class="heading-actions">
            <button id="workflow-toggle" class="workflow-toggle" type="button" aria-pressed="false">高亮最小生产流程</button>
            <span id="module-count" class="count"></span>
          </div>
        </div>
        <div id="module-grid" class="module-grid"></div>
      </section>
      <section class="relationships" aria-labelledby="relationships-heading">
        <div class="section-heading">
          <h2 id="relationships-heading">架构关系</h2>
          <span id="relationship-count" class="count"></span>
        </div>
        <div id="relationship-list" class="relationship-list"></div>
      </section>
      <details id="source-facts" class="source-facts">
        <summary>
          <span>源码事实（按需查看）</span>
          <span id="source-facts-count" class="summary-hint"></span>
        </summary>
        <div class="source-facts-content">
          <p class="source-facts-notice">自动静态事实不赋予七模块归属，也不证明运行可达或架构协作。动态 import、运行时调用和完整调用图未采集，保持 unknown。范围外文件仅表示未纳入本次扫描，不代表历史、停用或无效。</p>
          <label for="source-module-select">选择源码模块</label>
          <select id="source-module-select"></select>
          <div id="source-module-detail" aria-live="polite"></div>
        </div>
      </details>
      <details id="history-and-auxiliary" class="history-and-auxiliary">
        <summary><span id="history-title">历史与辅助区</span><span class="summary-hint">默认收起</span></summary>
        <div id="history-content"></div>
      </details>
      <nav id="bottom-navigation" class="bottom-navigation" aria-label="返回导航" hidden>
        <button id="back-button" type="button">返回上一级</button>
        <button id="home-button" type="button">返回最高级</button>
      </nav>
      <p id="load-error" class="load-error" role="alert" hidden></p>
    </main>
    <div id="module-context-menu" class="context-menu" role="menu" hidden>
      <button id="context-evidence" type="button" role="menuitem">查看关系与源码证据</button>
    </div>
    <dialog id="relationship-detail" class="relationship-detail" aria-labelledby="detail-title">
      <form method="dialog"><button class="dialog-close" aria-label="关闭关系详情">×</button></form>
      <div id="detail-content"></div>
    </dialog>
    <script src="explorer-data.js"></script>
    <script src="t4-state.js"></script>
    <script src="app.js"></script>
  </body>
</html>
