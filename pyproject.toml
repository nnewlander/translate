[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booktrans"
version = "0.1.0"
description = "Read-only OOXML inspection and source-integrity foundation for book translation."
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0",
  "pypdf>=4.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "python-docx>=1.1",
]

[project.scripts]
booktrans = "booktrans.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"booktrans.storage" = ["schema.sql"]
